<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Organization — Observability</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<header>
  <h1>Organization — Observability</h1>
  <span id="status" class="status">connecting…</span>
</header>
<main>
  <section class="charts">
    <div class="card">
      <h2>Agents over time (by department)</h2>
      <canvas id="chart-agents"></canvas>
    </div>
    <div class="card">
      <h2>Code edits over time</h2>
      <canvas id="chart-edits"></canvas>
    </div>
    <div class="card">
      <h2>Tool calls over time (by outcome)</h2>
      <canvas id="chart-tools"></canvas>
    </div>
    <div class="card">
      <h2>Cycle duration per iteration</h2>
      <canvas id="chart-cycles"></canvas>
    </div>
  </section>
  <section class="monitor">
    <div class="card">
      <h2>Active pod — live</h2>
      <div id="active-pod" class="pod-live">no active pod</div>
    </div>
    <div class="card">
      <h2>Historical pods (last 10)</h2>
      <ul id="pod-list" class="pod-list"></ul>
    </div>
  </section>
</main>
<script src="/web/app.js"></script>
</body>
</html>
